name: daily-fmp-pipeline

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 2 * * *'
    - cron: '0 */4 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:
    inputs:
      domain:
        description: 'Domain to run (reference|prices|fundamentals|events|analyst)'
        required: true
        default: 'reference'

jobs:
  ingest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        domain: [reference, fundamentals, events, prices, analyst]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selected domain (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_BASE_URL: https://financialmodelingprep.com
        run: python scripts/fmp_pipeline.py --domain "${{ github.event.inputs.domain }}"

      - name: Run matrix domain (schedule)
        if: github.event_name == 'schedule'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_BASE_URL: https://financialmodelingprep.com
        run: python scripts/fmp_pipeline.py --domain "${{ matrix.domain }}"
