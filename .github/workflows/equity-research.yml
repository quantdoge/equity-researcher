# Runs the full research pipeline for every ticker below, one at a time, and
# commits each memo (outputs/) and run log (runs/) back to the branch.
#
# Edit the ticker list in `matrix.ticker`. Each ticker is its own job, so one
# failure doesn't stop the rest, and GitHub's 6-hour job limit applies per
# ticker rather than to the whole list.
#
# Every push to main triggers the FULL research matrix (one paid pipeline run per
# ticker). Merges that only touch infrastructure (workflows, docs, eval tooling)
# should carry [skip ci] in the commit message.
#
# After each ticker's pipeline, its newest output is scored with TypeSafe Jev
# (equity_mcp.evaluation.evaluate). That step is best-effort: it can never fail
# the job or block the commit.
name: Equity research

on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue overlapping runs rather than racing them on the push back to main.
concurrency:
  group: equity-research
  cancel-in-progress: false

jobs:
  research:
    name: research (${{ matrix.ticker }})
    runs-on: ubuntu-latest
    environment: DEV          # the secrets live in this GitHub Environment
    timeout-minutes: 180
    permissions:
      contents: write         # to commit results back
    strategy:
      fail-fast: false        # one ticker failing doesn't cancel the others
      max-parallel: 2         # sequential — also keeps OpenRouter rate limits in check
      matrix:
        ticker:
          - ACN
          - OKTA
          - ZS
          - IBM
          - CRM
          - NOW

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Recorded before Install so the margin to the orchestrator's run stamp is
      # tens of seconds, not a same-second tie. The evaluate step uses it to
      # refuse any output older than this job (i.e. a checked-in one).
      # The orchestrator stamps runs with the runner's LOCAL clock
      # (datetime.now() in run_log.py); GitHub-hosted runners are UTC, so -u
      # matches. On a self-hosted runner with a non-UTC TZ, drop the -u.
      - name: Record job start stamp
        run: echo "JOB_START=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_ENV"

      - name: Install
        run: pip install -e .

      - name: Run research pipeline
        env:
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          FMP_API_KEY:          ${{ secrets.FMP_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          BRAVE_API_KEY:        ${{ secrets.BRAVE_API_KEY }}
          SERP_API_KEY:         ${{ secrets.SERP_API_KEY }}
          FRED_API_KEY:         ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT:       ${{ secrets.SEC_USER_AGENT }}
          OPENROUTER_APP_URL:   ${{ secrets.OPENROUTER_APP_URL }}
          OPENROUTER_APP_TITLE: ${{ secrets.OPENROUTER_APP_TITLE }}
          DATABASE_URL:         ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          # A secret that isn't set arrives as "". Unset it so code that falls
          # back to a default (e.g. SEC_USER_AGENT) gets the default, not "".
          for v in ANTHROPIC_API_KEY BRAVE_API_KEY SERP_API_KEY FRED_API_KEY \
                   SEC_USER_AGENT OPENROUTER_APP_URL OPENROUTER_APP_TITLE DATABASE_URL; do
            [ -z "${!v}" ] && unset "$v"
          done
          python -m equity_mcp.orchestrator --symbol "${{ matrix.ticker }}"

      # Score this ticker's newest output with Jev and store it in the eval DB.
      # always(): a partial run still writes an output JSON worth scoring.
      # continue-on-error: an eval failure must never cost us the commit below.
      # --require-newer-than: if the pipeline produced nothing, don't re-score
      # an older checked-in output instead.
      # Writes nothing under outputs/ or runs/; with no DB it falls back to
      # evals/, which the commit step below does not stage.
      - name: Evaluate outputs (Jev)
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        env:
          TYPESAFE_API_KEY:     ${{ secrets.TYPESAFE_API_KEY }}
          SUPABASE_EVAL_DB_URL: ${{ secrets.SUPABASE_EVAL_DB_URL }}
          JEV_MODEL:            ${{ vars.JEV_MODEL || 'jev-1.13.0' }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::notice::TYPESAFE_API_KEY is not set; skipping Jev evaluation."
            exit 0
          fi
          # As above: an unset secret arrives as "". Unset it so the CLI sees
          # "no eval DB" rather than an empty connection string.
          [ -z "$SUPABASE_EVAL_DB_URL" ] && unset SUPABASE_EVAL_DB_URL
          python -m equity_mcp.evaluation.evaluate \
            --symbol "${{ matrix.ticker }}" --latest \
            --require-newer-than "$JOB_START"

      # always(): a run that fails or times out still leaves every finished
      # specialist's report in runs/<id>/reports/, which is worth keeping.
      - name: Commit results
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Separately: one missing directory would make a combined add stage nothing.
          for d in outputs runs; do [ -d "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "No results to commit."
            exit 0
          fi
          # Pushes made with GITHUB_TOKEN don't trigger workflows; [skip ci] is belt and braces.
          git commit -m "research: ${{ matrix.ticker }} memo [skip ci]"
          # Earlier tickers in this run (or a human) may have pushed since checkout.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
