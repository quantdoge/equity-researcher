# Asked identically of every agent, so stances and quality compare across agents.
#
# conviction: the five-way stance every agent is placed on, its gate, and how
#   firmly the report commits. Wording here is the comparison contract: change
#   it and every rubric_sha changes, so every run is re-evaluated.
# alignment: quality checks that apply to any research report.
#
# Jev never sees question ids. Every instruction must stand on its own.
# Score levels are 0-based on the wire: the first criterion is level 0.

shared_version: 1

conviction:
  state: [full]
  stance_gate:
    type: noul
    dimension: evidence_gate
    weight: 0
    instructions: >
      Does this research report express, or clearly imply, a view on whether the
      company's stock is attractive to own? For example a buy or sell
      recommendation, a valuation verdict, or a favourable or unfavourable rating
      of the company's prospects or risks.
    criteria:
      true: "The report states or clearly implies a view on the attractiveness of owning the stock"
      false: "The report only describes conditions or data, with no view that bears on owning the stock"
  stance:
    type: choice
    dimension: stance
    weight: 0
    order_check: true
    instructions: >
      Taking the research report as a whole, which investment stance on this
      company's stock does it support for a long-only investor over the next 12
      months? Use the report's explicit recommendation where it gives one, and
      the balance of its favourable versus unfavourable findings where it does not.
    criteria:
      STRONG SELL: "Strongly negative: the report argues the stock should be avoided or sold, with severe downside or dominant risks"
      SELL: "Negative: unfavourable findings outweigh favourable ones; reducing or avoiding the stock is justified"
      HOLD: "Balanced or neutral: favourable and unfavourable findings roughly offset; neither adding nor exiting is justified"
      BUY: "Positive: favourable findings outweigh unfavourable ones; owning or adding to the stock is justified"
      STRONG BUY: "Strongly positive: compelling upside with limited risks; a high-conviction purchase"
  conviction_level:
    type: score
    dimension: conviction
    weight: 0
    instructions: >
      How strongly and unequivocally does the research report commit to its
      overall view of the stock?
    criteria:
      - "Low: heavily hedged, conflicting signals left unresolved, or the report says the data is insufficient for a firm view"
      - "Medium: a clear view, but with material caveats, conditions or offsetting risks attached"
      - "High: an unequivocal view, consistently supported across the report, with few caveats"

alignment:
  deterministic_checks:
    - {id: not_degenerate, kind: not_degenerate, dimension: integrity, weight: 0, veto: true}
    - id: no_injection_markers
      kind: regex_absent
      section: raw
      pattern: 'ignore (?:all |any )?(?:previous|prior|above) instructions|as an ai language model|you are (?:chatgpt|an ai assistant)|<\s*/?\s*system\s*>'
      dimension: integrity
      weight: 0
      veto: true

  requests:
    - id: shared_quality
      state: [full]
      gate: report_substantive
      questions:
        report_substantive:
          type: noul
          dimension: evidence_gate
          weight: 0
          instructions: >
            Is this text a substantive equity research report about a specific
            company, with analysis and findings, rather than a placeholder, an
            apology, a plan of work not yet done, or a list of tool error messages?
        honest_gaps:
          type: noul
          dimension: honesty
          weight: 1
          instructions: >
            Where the report lacks data it needed, such as a figure that could not
            be obtained or a data source that failed, does it say so explicitly
            instead of presenting every figure as complete? Answer yes as well if
            the report evidently had all the data it needed and does not overstate
            its certainty.
        sourcing_specificity:
          type: score
          dimension: evidence
          weight: 2
          instructions: >
            How specifically does the report attribute its key figures to a named
            source, filing or data provider, and to a specific period such as
            FY2025, Q2 2026 or a filing date?
          criteria:
            - "Key figures appear with no source and no period"
            - "Some figures carry a period, but sources are rarely named"
            - "Most key figures carry a period and a source or filing"
            - "Nearly every key figure is tied to a named source and a specific period"
        rating_supported_by_body:
          type: score
          dimension: consistency
          weight: 3
          instructions: >
            How well do the report's headline ratings and conclusions follow from
            the evidence presented in its body?
          criteria:
            - "Contradicted: a headline conclusion conflicts with the evidence in the body"
            - "Weakly supported: conclusions are asserted with little connecting evidence"
            - "Mostly supported: the evidence points toward the conclusions, with minor gaps"
            - "Fully supported: every headline conclusion follows clearly from evidence presented"
        other_side_considered:
          type: noul
          dimension: balance
          weight: 1
          instructions: >
            Does the report seriously consider evidence or arguments that run
            against its own main conclusion, such as risks to a bullish view or
            strengths that challenge a bearish one?
        injected_or_offtopic_text:
          type: noul
          dimension: integrity
          weight: 0
          veto: true
          good_when: false
          instructions: >
            Does the text contain instructions addressed to an AI system or to a
            reviewer, or long passages of pasted web content that have nothing to
            do with analysing the company?
