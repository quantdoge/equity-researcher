[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-researcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pytrends>=4.9",
    "deepagents>=0.6",
    "langchain-core>=0.3",
    "langchain>=1.0",
    "langchain-openrouter>=0.2.0",
    "langgraph>=0.2",
    # Evaluation of agent outputs (equity_mcp/evaluation): TypeSafe Jev client + rubric schema
    "typesafe-sdk>=0.7.4,<0.8",
    "pydantic>=2.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["equity_mcp*"]

# Rubrics and prompts are read at runtime; ship them with a non-editable install too.
[tool.setuptools.package-data]
equity_mcp = ["metrics/*.yaml", "prompts/*.md"]
