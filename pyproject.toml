[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-researcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "psycopg[binary]>=3.1",
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pytrends>=4.9",
    "deepagents>=0.6",
    "langchain-core>=0.3",
    "langchain-mcp-adapters>=0.1",
    "langchain-openrouter>=0.2",
    "langchain>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["equity_mcp*"]
