[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "equity-researcher"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "anthropic>=0.40",
    "psycopg[binary]>=3.1",
    "requests>=2.32",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pytrends>=4.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["equity_mcp*"]
